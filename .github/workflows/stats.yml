name: Generate GitHub Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: jstrieb/github-stats@master
        with:
          username: samihavahora05
          exclude_repos: samihavahora05
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
